display_information:
  name: Agenda Radar
  description: Editorial signals, evidence and human decisions
  background_color: "#18283f"
features:
  bot_user:
    display_name: Agenda Radar
    always_online: false
  slash_commands:
    - command: /radar
      description: Agenda, gaps, briefing, help or link your account
      usage_hint: "agenda | gaps | briefing | help | link CODE"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
