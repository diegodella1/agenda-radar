{% extends 'base.html' %}{% block content %}<h1>Mi cuenta</h1><p>{{ user.email }}</p><form data-endpoint="{{ base_path }}/api/v1/auth/password" data-setup><label>Contraseña actual<input name="current_password" type="password" autocomplete="current-password" required maxlength="256"></label><label>Nueva contraseña<input name="new_password" type="password" autocomplete="new-password" required minlength="12" maxlength="256"></label><button>Cambiar contraseña</button><p>Se cerrarán todas tus sesiones. Volvé a ingresar con la nueva contraseña.</p></form>{% endblock %}
