<dialog id="demo-tour" class="tour-dialog" aria-labelledby="tour-title" aria-describedby="tour-copy"
  data-sources-ready="{{ 'true' if onboarding_ready.sources else 'false' }}"
  data-criteria-ready="{{ 'true' if onboarding_ready.criteria else 'false' }}"
  data-news-ready="{{ 'true' if onboarding_ready.news else 'false' }}">
  <div class="tour-spotlight" aria-hidden="true" hidden></div>
  <section class="tour-card">
    <div class="tour-topline"><p id="tour-step" class="eyebrow"></p><button type="button" class="quiet" data-tour-skip aria-label="{{ _("Omitir tutorial") }}">{{ _("Omitir") }}</button></div>
    <div class="tour-progress" aria-hidden="true"><span></span></div>
    <h2 id="tour-title" tabindex="-1"></h2>
    <p id="tour-copy"></p>
    <p id="tour-note" class="muted" hidden></p>
    <ul id="tour-checklist" class="tour-checklist" hidden></ul>
    <div class="tour-controls"><button type="button" class="secondary" data-tour-back>{{ _("Anterior") }}</button><button type="button" data-tour-next>{{ _("Siguiente →") }}</button></div>
  </section>
</dialog>
